name: Generate contribution-snake
on:
  schedule:
    - cron: '0 0 * * *'   # opcional: atualiza diariamente
  workflow_dispatch: {}    # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Generate contribution snake
        # Ajuste este comando para o CLI/action que você usa para gerar o SVG
        run: npx github-contribution-grid-snake --svg-out-path dist/github-contribution-grid-snake.svg

      - name: Commit generated SVG
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: 'dist/github-contribution-grid-snake.svg'
